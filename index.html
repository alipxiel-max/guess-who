<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي الـ 50 الذكي: من هو؟ 🕵️‍♂️</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background: #121214; color: #fff; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        .header { text-align: center; max-width: 600px; margin-bottom: 20px; }
        .header h1 { color: #38ef7d; font-size: 26px; margin-bottom: 8px; }
        .header p { color: #aaa; font-size: 14px; }

        /* قوائم التحكم واختيار الكاتوقيري */
        .controls { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 500px; margin-bottom: 20px; }
        .select-style { width: 100%; padding: 12px; border-radius: 10px; border: none; background: #2a2a35; color: white; font-size: 16px; font-weight: bold; text-align: center; cursor: pointer; }
        
        /* صندوق اللاعب المختار سرياً */
        .secret-box { background: #1e1e24; border: 2px dashed #fbc531; border-radius: 12px; padding: 15px; width: 100%; max-width: 500px; text-align: center; font-weight: bold; font-size: 16px; }
        #chosen-item-name { color: #fbc531; font-size: 19px; }

        /* شبكة العرض (أربع كروت في السطر للابتوب وتتعدل تلقائياً للجوال) */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; width: 100%; max-width: 800px; margin-top: 20px; }
        
        /* كرت العنصر */
        .item-card { background: #1e1e24; border-radius: 10px; overflow: hidden; position: relative; cursor: pointer; transition: all 0.2s ease; border: 2px solid #2a2a35; text-align: center; }
        .item-card img { width: 100%; height: 110px; object-fit: cover; display: block; filter: grayscale(0); opacity: 1; transition: 0.2s; background: #121214; }
        .item-card p { padding: 8px; font-size: 13px; font-weight: bold; background: #222; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* تأثير التشطيب والاستبعاد */
        .item-card.eliminated { border-color: #ea2027; }
        .item-card.eliminated img { filter: grayscale(1) blur(2px); opacity: 0.15; }
        .item-card.eliminated p { background: #4d1b1b; color: #888; text-decoration: line-through; }

        /* زر إعادة اللعب */
        .btn-reset { background: #ea2027; color: white; border: none; padding: 12px 25px; font-size: 16px; font-weight: bold; border-radius: 10px; cursor: pointer; margin-top: 20px; width: 100%; max-width: 500px; transition: 0.2s; }
        .btn-reset:hover { background: #ff3838; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🕵️‍♂️ لعبة التخمين والتشطيب الكبرى</h1>
        <p>اختر القسم، اسأل خصمك في الحقيقة، واشطب على الكروت المستبعدة بالضغط عليها!</p>
    </div>

    <div class="controls">
        <select id="category-selector" class="select-style" onchange="switchCategory()">
            <option value="footballers">⚽ قسم: لاعبين كرة قدم (50 لاعب)</option>
            <option value="food">🍕 قسم: أكلات شهية (50 أكلة)</option>
            <option value="youtubers">🎬 قسم: يوتيوبرز ومشاهير (50 يوتيوبر)</option>
            <option value="characters">🦸‍♂️ قسم: شخصيات متنوعة (50 شخصية)</option>
        </select>
        
        <div class="secret-box" id="secret-container">
            💡 اضغط مرتين (Double Tap) على أي كرت لتحديده كـ "اختيارك السري"
        </div>
    </div>

    <div class="grid" id="game-grid"></div>

    <button class="btn-reset" onclick="resetGame()">إعادة تصفير اللوحة الحالية 🔄</button>

    <script>
        // قاعدة البيانات الكبرى - 4 أقسام في كل قسم 50 قالب جاهز للتعديل
        const gameDatabase = {
            footballers: [
                { name: "messi", img: "https://imageio.forbes.com/specials-images/imageserve/663e595b4509f97fdafb95f5/0x0.jpg?format=jpg&crop=383,383,x1045,y23,safe&height=416&width=416&fit=bounds" },
                { name: "Ronaldo", img: "https://imageio.forbes.com/specials-images/imageserve/645ea1c4fce09061884bd21c/0x0.jpg?format=jpg&crop=2774,2772,x925,y0,safe&height=416&width=416&fit=bounds" },
                { name: "Neymar", img: "https://images.ctfassets.net/3mv54pzvptwz/7Jj4ryLGJazS8pDUlCK2Vg/0720ffad6fe1c0587dd1f9df0c323b01/54331642772_05fa9ffe6b_o_dentro.jpg" },
                { name: "suarez", img: "https://www.alyaum.com/uploads/images/2024/02/15/2249012.jpg" },
                { name: "van dijk", img: "https://ichef.bbci.co.uk/ace/standard/976/cpsprodpb/6112/live/86a9ef20-1b76-11f0-ae04-a7ed40059b9f.jpg.webp" },
                { name: "salem", img: "https://sportlink.com.sa/wp-content/uploads/2022/06/Salem-Al-Dawsari.jpg" },
                { name: "coman", img: "https://resources.saudi-pro-league.pulselive.com/photo-resources/2025/08/16/2e246154-987a-4b31-a222-1e18073fd33f/Gya6Bb1bkAAqYSn.jpeg?width=1868&height=1136" },
                { name: "lewandoski", img: "https://www.fcbarcelona.com/photo-resources/2025/09/10/6dd5aa47-d5fb-45a5-b171-0da82c9c7105/09-Lewandowski.jpg?width=640&height=400" },
                { name: "vinicius", img: "https://s.yimg.com/ny/api/res/1.2/LiB8H16dK3RcWjEMZExONw--/YXBwaWQ9aGlnaGxhbmRlcjt3PTk2MDtoPTY0MDtjZj13ZWJw/https://media.zenfs.com/en/onefootball_articles_802/e4f539a94989e27251d980dfad0b6093" },
                { name: "mbappe", img: "https://www.reuters.com/resizer/v2/UEZBDF5MXZJLVMRBSWFJZ6ZCBI.jpg?auth=9a6a5c1942e632b46601abc56feb49d43cba25818bf30db3f62fa2b611681ce9&width=640&quality=80" },
                { name: "yamal", img: "https://media1.tenor.com/m/g3xi96MFrd0AAAAd/lamine-yamal-lamineyamal.gif" },
                { name: "belingham", img: "https://cdn.britannica.com/73/276673-050-9BC8EE1D/Jude-Bellingham-with-UEFA-Champions-League-trophy-after-win-June-2024.jpg" },
                { name: "pedri", img: "https://ichef.bbci.co.uk/ace/standard/800/cpsprodpb/6a1f/live/e13f4ec0-b4dd-11f0-b31a-d15d08f211be.jpg.webp" },
                { name: "dypala", img: "https://sempreinter.com/wp-content/uploads/2024/06/Paulo-Dybala-Roma-9-825x510.jpg" },
                { name: "pogba", img: "https://img.lemde.fr/2026/01/22/0/0/2631/1754/556/0/75/0/689dc55_upload-1-3lvemddfplik-000-86kn88e.jpg" },
                { name: "pele", img: "https://static01.nyt.com/images/2022/12/22/multimedia/00pele-photos-1-32de/00pele-photos-1-32de-superJumbo.jpg?quality=75&auto=webp" },
                { name: "cruyff", img: "https://upload.wikimedia.org/wikipedia/commons/c/cb/Johan_Cruijff_%281974%29.jpg" },
                { name: "noor", img: "https://upload.wikimedia.org/wikipedia/commons/a/ae/Mohammed_Noor_In_the_Saudi_national_team_training.jpg" },
                { name: "palmer", img: "https://ichef.bbci.co.uk/ace/standard/800/cpsprodpb/db08/live/90166840-a389-11f0-a56f-0b1b78ebdf89.jpg.webp" },
                { name: "foden", img: "https://i.guim.co.uk/img/media/5ffcda128c221dbfc54ec9f6c74f84212cb90a7c/0_74_2300_1380/master/2300.jpg?width=1900&dpr=1&s=none&crop=none" },
                { name: "sane", img: "https://assets.goal.com/images/v3/getty-2236778484/crop/MM5DEOJSHA5DCNRUG45G433XMU5DCMRWGM5DCOJT/GettyImages-2236778484.jpg?auto=webp&format=pjpg&width=640&quality=60" },
                { name: "dembele", img: "https://i.guim.co.uk/img/media/aa7aebc0a6aa9a29d4fc43f1d37160414f10e6ab/603_306_3663_2932/master/3663.jpg?width=1900&dpr=1&s=none&crop=none" },
                { name: "maradona", img: "https://upload.wikimedia.org/wikipedia/commons/4/48/Argentina_celebrando_copa_%28cropped%29.jpg" }
            ],
            food: [
                { name: "أكلة 1", img: "https://images.unsplash.com/photo-1513104890138-7c749659a591?w=150" },
                { name: "أكلة 2", img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=150" },
                { name: "أكلة 3", img: "https://images.unsplash.com/photo-1579871494447-9811cf80d66c?w=150" },
                { name: "أكلة 4", img: "https://images.unsplash.com/photo-1546549032-9571cd6b27df?w=150" },
                { name: "أكلة 5", img: "https://images.unsplash.com/photo-1565299585323-38d6b0865b47?w=150" },
                // ... تم تكرار الـ 50 تلقائياً لتوفير المساحة في العرض، جاهزة في الكود الفعلي تحت
                ...Array.from({length: 45}, (_, i) => ({ name: `أكلة ${i+6}`, img: "https://images.unsplash.com/photo-1513104890138-7c749659a591?w=150" }))
            ],
            youtubers: [
                { name: "يوتيوبر 1", img: "https://images.unsplash.com/photo-1626785774573-4b799315345d?w=150" },
                { name: "يوتيوبر 2", img: "https://images.unsplash.com/photo-1618519764620-7403abdbfee9?w=150" },
                { name: "يوتيوبر 3", img: "https://images.unsplash.com/photo-1560169897-fc0cdbdfa4d5?w=150" },
                ...Array.from({length: 47}, (_, i) => ({ name: `يوتيوبر ${i+4}`, img: "https://images.unsplash.com/photo-1626785774573-4b799315345d?w=150" }))
            ],
            characters: [
                { name: "شخصية 1", img: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" },
                { name: "شخصية 2", img: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150" },
                { name: "شخصية 3", img: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150" },
                ...Array.from({length: 47}, (_, i) => ({ name: `شخصية ${i+4}`, img: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" }))
            ]
        };

        const grid = document.getElementById('game-grid');
        const secretContainer = document.getElementById('secret-container');
        const categorySelector = document.getElementById('category-selector');

        function renderGrid() {
            grid.innerHTML = "";
            const currentCategory = categorySelector.value;
            const items = gameDatabase[currentCategory];

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = "item-card";
                card.innerHTML = `
                    <img src="${item.img}" alt="${item.name}">
                    <p>${item.name}</p>
                `;

                // ضغطة واحدة: تشطيب واستبعاد
                card.onclick = function() {
                    card.classList.toggle('eliminated');
                };

                // ضغطتين متتاليتين: اختيار العنصر السري
                card.ondblclick = function() {
                    secretContainer.innerHTML = `🔒 اختيارك السري الحالي: <span id="chosen-item-name">${item.name}</span>`;
                };

                grid.appendChild(card);
            });
        }

        function switchCategory() {
            secretContainer.innerHTML = "💡 اضغط مرتين (Double Tap) على أي كرت لتحديده كـ \"اختيارك السري\"";
            renderGrid();
        }

        function resetGame() {
            renderGrid();
        }

        // تشغيل اللعبة لأول مرة
        renderGrid();
    </script>
</body>
</html>
